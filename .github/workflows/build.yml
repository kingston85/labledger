name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org lr.labledger --project-name labledger .
          fi
          bash tool/patch_android.sh

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Report build error
        if: failure()
        shell: bash
        run: |
          if [ -f analyze.log ] && grep -q "error •" analyze.log; then
            msg=$(grep "error •" analyze.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Analyzer errors::${msg}"
          fi
          if [ -f test.log ] && grep -qE "Some tests failed|\[E\]|Expected:" test.log; then
            msg=$(grep -n -B2 -A12 -E "\[E\]|Expected:" test.log | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test failures::${msg}"
          fi
          if [ -f build.log ]; then
            msg=$(grep -n -A40 -E "What went wrong|error:|Error:|FAILURE" build.log | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
          fi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk LabLedger-${{ github.run_number }}.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabLedger-apk
          path: LabLedger-${{ github.run_number }}.apk


  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Windows platform files
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          if [ ! -d windows ]; then
            flutter create --platforms=windows --org lr.labledger --project-name labledger .
          fi
          python tool/patch_windows.py LabLedger

      - name: Build Windows app
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build-win.log

      - name: Report build error
        if: failure()
        shell: bash
        run: |
          if [ -f build-win.log ]; then
            msg=$(grep -n -B3 -A25 -iE "error|failed" build-win.log | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Windows build failed::${msg}"
          fi

      - name: Package zip
        shell: pwsh
        run: |
          $out = "LabLedger-Windows-${{ github.run_number }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse build\windows\x64\runner\Release\* $out
          Set-Content -Path "$out\README.txt" -Value "LabLedger for Windows`r`n`r`nDouble-click LabLedger.exe to start. Keep all files in this folder together.`r`nIf Windows shows 'Windows protected your PC', click 'More info' then 'Run anyway'.`r`nYour data is saved in %APPDATA%\LabLedger\LabLedger."
          Compress-Archive -Path $out -DestinationPath "$out.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: LabLedger-windows
          path: LabLedger-Windows-${{ github.run_number }}.zip

  release:
    needs: [build, windows]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LabLedger build ${{ github.run_number }}
          body: |
            Android: download the APK on your phone and open it (allow "Install unknown apps" for your browser).
            Windows: download the zip, extract it, and run LabLedger.exe. On the first run choose "More info" then "Run anyway".
            Commit: ${{ github.sha }}
          files: dist/*
          make_latest: true
