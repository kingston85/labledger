name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org lr.labledger --project-name labledger .
          fi
          bash tool/patch_android.sh

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Publish sample documents from tests
        if: always() && hashFiles('test_output/*.docx') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sample-reports
          name: Sample documents (generated by tests)
          prerelease: true
          make_latest: false
          body: Example reports, forms and workbooks generated from the demo data by the automated tests on every build.
          files: |
            test_output/*.docx
            test_output/*.pdf
            test_output/*.xlsx

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Report build error
        if: failure()
        shell: bash
        run: |
          if [ -f analyze.log ] && grep -q "error •" analyze.log; then
            msg=$(grep "error •" analyze.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Analyzer errors::${msg}"
          fi
          if [ -f test.log ] && grep -qE "Some tests failed|\[E\]|Expected:" test.log; then
            msg=$(grep -n -B2 -A12 -E "\[E\]|Expected:" test.log | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test failures::${msg}"
          fi
          if [ -f build.log ]; then
            msg=$(grep -n -A40 -E "What went wrong|error:|Error:|FAILURE" build.log | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
          fi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk LabLedger-${{ github.run_number }}.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabLedger-apk
          path: LabLedger-${{ github.run_number }}.apk


  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Windows platform files
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          if [ ! -d windows ]; then
            flutter create --platforms=windows --org lr.labledger --project-name labledger .
          fi
          python tool/patch_windows.py LabLedger

      - name: Build Windows app
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build-win.log

      - name: Report build error
        if: failure()
        shell: bash
        run: |
          if [ -f build-win.log ]; then
            msg=$(grep -n -B3 -A25 -iE "error|failed" build-win.log | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Windows build failed::${msg}"
          fi

      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          # App-local copies so the app runs on PCs without the VC++ redistributable.
          foreach ($d in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            Copy-Item "C:\Windows\System32\$d" build\windows\x64\runner\Release\ -ErrorAction SilentlyContinue
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver.${{ github.run_number }}" "/DSourceDir=$PWD\build\windows\x64\runner\Release" "/DOutputName=LabLedger-Setup-${{ github.run_number }}" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { echo "::error title=Installer build failed::ISCC exit $LASTEXITCODE"; exit 1 }
          Get-ChildItem dist

      - name: Package portable zip
        shell: pwsh
        run: |
          $out = "LabLedger-Windows-Portable-${{ github.run_number }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse build\windows\x64\runner\Release\* $out
          Set-Content -Path "$out\README.txt" -Value "LabLedger for Windows (portable)`r`n`r`nDouble-click LabLedger.exe to start. Keep all files in this folder together.`r`nTo install properly with shortcuts and an uninstaller, use LabLedger-Setup.exe instead.`r`nYour data is saved in %APPDATA%\LabLedger\LabLedger."
          Compress-Archive -Path $out -DestinationPath "dist\$out.zip"

      - name: Package for the Microsoft Store (MSIX)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
        run: |
          # Unsigned package for Store submission: the Store signs it with
          # Microsoft's certificate, so Smart App Control trusts the app.
          $identity = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { 'LabLedger.LabLedger' }
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { 'CN=LabLedger' }
          $pubName = if ($env:MSIX_PUBLISHER_NAME) { $env:MSIX_PUBLISHER_NAME } else { 'LabLedger' }
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+)\.([0-9]+)').Matches[0]
          $msixVer = "$($ver.Groups[1].Value).$($ver.Groups[2].Value).${{ github.run_number }}.0"
          $stage = "msix-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse build\windows\x64\runner\Release\* $stage
          Copy-Item -Recurse installer\msix\Assets $stage
          $m = Get-Content installer\msix\AppxManifest.template.xml -Raw
          $m = $m.Replace('__IDENTITY__', $identity).Replace('__PUBLISHER__', $publisher).Replace('__PUBLISHER_NAME__', $pubName).Replace('__VERSION__', $msixVer)
          Set-Content -Path "$stage\AppxManifest.xml" -Value $m -Encoding UTF8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { echo "::warning title=MSIX skipped::makeappx.exe not found"; exit 0 }
          & $makeappx.FullName pack /o /d $stage /p "dist\LabLedger-Store-${{ github.run_number }}.msix"
          if ($LASTEXITCODE -ne 0) { echo "::warning title=MSIX packaging failed::makeappx exit $LASTEXITCODE"; exit 0 }
          echo "MSIX $msixVer for $identity / $publisher"

      - uses: actions/upload-artifact@v4
        with:
          name: LabLedger-windows
          path: dist/*

  release:
    needs: [build, windows]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LabLedger build ${{ github.run_number }}
          body: |
            Android: download the APK on your phone and open it (allow "Install unknown apps" for your browser).
            Windows: download LabLedger-Setup and run it, accept the licence and click Install. If SmartScreen appears, choose "More info" then "Run anyway". A portable zip is also attached.
            Microsoft Store: LabLedger-Store-*.msix is the package to upload in Partner Center (see STORE.md).
            Commit: ${{ github.sha }}
          files: dist/*
          make_latest: true
